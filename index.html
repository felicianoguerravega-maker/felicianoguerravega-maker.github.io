<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi PituFINA ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #2d0b1e 0%, #12040d 70%, #050106 100%);
            color: #ffffff;
            user-select: none;
        }

        .cinzel-font {
            font-family: 'Cinzel', serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.5);
            border-radius: 4px;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 15px rgba(244,114,182,0.6)); }
            50% { opacity: 0.8; filter: drop-shadow(0 0 25px rgba(251,191,36,0.8)); }
        }

        .glow-effect {
            animation: glowPulse 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen relative overflow-hidden flex flex-col justify-between">

    <!-- Elemento de audio que apunta al archivo musica.mp3 en la misma carpeta -->
    <audio id="bg-music" src="musica.mp3" loop preload="auto"></audio>

    <header class="relative z-10 p-4 md:p-6 flex justify-between items-center w-full max-w-7xl mx-auto pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-3">
            <div class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-amber-300 shadow-lg glow-effect">
                <i class="fa-solid fa-gem text-lg"></i>
            </div>
            <div>
                <h1 class="cinzel-font text-lg md:text-xl font-bold bg-gradient-to-r from-amber-200 via-rose-300 to-amber-100 bg-clip-text text-transparent">
                    Para mi PituFINA👑💖
                </h1>
                <p class="text-xs text-rose-200/70 font-light">Un mensaje especial grabado en 3D</p>
            </div>
        </div>

        <div class="pointer-events-auto flex gap-2">
            <button id="audio-btn" class="glass-panel px-4 py-2 rounded-full text-xs md:text-sm font-medium flex items-center gap-2 hover:bg-white/10 transition-all border border-rose-300/30 text-rose-100 active:scale-95">
                <i class="fa-solid fa-music text-amber-300"></i>
                <span id="audio-status">Música</span>
            </button>
            <button id="reset-cam-btn" class="glass-panel p-2.5 rounded-full text-xs md:text-sm flex items-center justify-center hover:bg-white/10 transition-all border border-rose-300/30 text-rose-100 active:scale-95" title="Restablecer vista">
                <i class="fa-solid fa-rotate-right text-amber-300"></i>
            </button>
        </div>
    </header>

    <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

    <div id="instruction-badge" class="absolute top-20 left-1/2 -translate-x-1/2 z-10 pointer-events-none transition-opacity duration-1000">
        <div class="glass-panel px-4 py-1.5 rounded-full text-xs text-rose-200/90 flex items-center gap-2 shadow-lg border border-amber-300/20">
            <i class="fa-solid fa-hand-pointer text-amber-300 animate-bounce"></i>
            <span>Arrastra para girar el cubo || Usa los botones para enfocar</span>
        </div>
    </div>

    <footer class="relative z-10 pb-6 pt-2 px-4 w-full flex flex-col items-center gap-3">
        <div class="glass-panel p-1.5 rounded-2xl flex flex-wrap justify-center gap-1.5 md:gap-2 max-w-full overflow-x-auto border border-amber-300/30 shadow-2xl">
            <button onclick="rotateToFace('front')" class="nav-btn px-3 py-1.5 rounded-xl text-xs font-medium text-rose-100 hover:bg-rose-500/20 transition border border-transparent hover:border-rose-400/40">
                1. Apertura
            </button>
            <button onclick="rotateToFace('back')" class="nav-btn px-3 py-1.5 rounded-xl text-xs font-medium text-rose-100 hover:bg-rose-500/20 transition border border-transparent hover:border-rose-400/40">
                2. Crecimiento
            </button>
            <button onclick="rotateToFace('left')" class="nav-btn px-3 py-1.5 rounded-xl text-xs font-medium text-rose-100 hover:bg-rose-500/20 transition border border-transparent hover:border-rose-400/40">
                3. Compromiso
            </button>
            <button onclick="rotateToFace('right')" class="nav-btn px-3 py-1.5 rounded-xl text-xs font-medium text-rose-100 hover:bg-rose-500/20 transition border border-transparent hover:border-rose-400/40">
                4. Tiempo
            </button>
            <button onclick="rotateToFace('top')" class="nav-btn px-3 py-1.5 rounded-xl text-xs font-medium text-rose-100 hover:bg-rose-500/20 transition border border-transparent hover:border-rose-400/40">
                5. Emoción
            </button>
            <button onclick="rotateToFace('bottom')" class="nav-btn px-3 py-1.5 rounded-xl text-xs font-medium text-amber-200 bg-amber-500/10 hover:bg-amber-500/20 transition border border-amber-400/30">
                6. PituFINA ❤️
            </button>
        </div>
    </footer>

    <script>
        const audioBtn = document.getElementById('audio-btn');
        const audioStatus = document.getElementById('audio-status');
        const bgAudio = document.getElementById('bg-music');
        let isPlaying = false;

        audioBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgAudio.pause();
                audioStatus.textContent = 'Música';
                audioBtn.classList.remove('bg-amber-500/30', 'border-amber-400');
                audioBtn.querySelector('i').className = 'fa-solid fa-music text-amber-300';
                isPlaying = false;
            } else {
                bgAudio.volume = 0.7;
                bgAudio.play().then(() => {
                    audioStatus.textContent = 'Pausar';
                    audioBtn.classList.add('bg-amber-500/30', 'border-amber-400');
                    audioBtn.querySelector('i').className = 'fa-solid fa-pause text-amber-300';
                    isPlaying = true;
                }).catch(err => {
                    console.log("No se pudo iniciar la música.", err);
                    alert("Asegúrate de colocar tu canción en la carpeta DEDICATORIA con el nombre 'musica.mp3'.");
                });
            }
        });

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x12040d, 0.08);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        function createFaceTexture(number, title, text, highlight = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
            if(highlight) {
                grad.addColorStop(0, '#2d0a1e');
                grad.addColorStop(0.5, '#4a122e');
                grad.addColorStop(1, '#1a0510');
            } else {
                grad.addColorStop(0, '#1c0814');
                grad.addColorStop(0.5, '#2a0c1f');
                grad.addColorStop(1, '#12040d');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.strokeStyle = highlight ? 'rgba(251, 191, 36, 0.8)' : 'rgba(244, 114, 182, 0.5)';
            ctx.lineWidth = 24;
            ctx.strokeRect(30, 30, 964, 964);

            ctx.strokeStyle = highlight ? '#f59e0b' : '#ec4899';
            ctx.lineWidth = 8;
            const cLen = 60;
            ctx.beginPath(); ctx.moveTo(60, 60 + cLen); ctx.lineTo(60, 60); ctx.lineTo(60 + cLen, 60); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(964 - cLen, 60); ctx.lineTo(964, 60); ctx.lineTo(964, 60 + cLen); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(60, 964 - cLen); ctx.lineTo(60, 964); ctx.lineTo(60 + cLen, 964); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(964 - cLen, 964); ctx.lineTo(964, 964); ctx.lineTo(964, 964 - cLen); ctx.stroke();

            ctx.fillStyle = highlight ? '#fbbf24' : '#f472b6';
            ctx.font = 'bold 36px Montserrat';
            ctx.textAlign = 'center';
            ctx.fillText(`— ${number} —`, 512, 140);

            ctx.fillStyle = highlight ? '#fef3c7' : '#ffffff';
            ctx.font = 'bold 52px Cinzel';
            ctx.fillText(title.toUpperCase(), 512, 220);

            ctx.beginPath();
            ctx.moveTo(362, 260);
            ctx.lineTo(662, 260);
            ctx.strokeStyle = highlight ? 'rgba(251, 191, 36, 0.6)' : 'rgba(244, 114, 182, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = highlight ? '#fff' : '#fce7f3';
            ctx.font = '500 42px Montserrat';
            ctx.textAlign = 'center';

            const words = text.split(' ');
            let line = '';
            let lines = [];
            const maxWidth = 800;
            const lineHeight = 65;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = 520 - ((lines.length - 1) * lineHeight) / 2;
            for (let k = 0; k < lines.length; k++) {
                ctx.fillText(lines[k].trim(), 512, startY + (k * lineHeight));
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = 'italic 30px Montserrat';
            ctx.fillText('✨', 512, 900);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const materials = [
            new THREE.MeshStandardMaterial({ 
                map: createFaceTexture('IV', 'Tiempo', 'El tiempo se quedó corto: casi 3 horas y se fueron rapidísimo.'),
                roughness: 0.2, metalness: 0.1
            }),
            new THREE.MeshStandardMaterial({ 
                map: createFaceTexture('III', 'Compromiso', 'De mi parte, escucho, soy empático y no te juzgo. Puedes contar conmigo; conmigo siempre tienes un espacio para hablar.'),
                roughness: 0.2, metalness: 0.1
            }),
            new THREE.MeshStandardMaterial({ 
                map: createFaceTexture('V', 'Emoción', 'Se me salieron algunas lágrimas mientras hablábamos, y eso dice exactamente lo importante que fue para mí.'),
                roughness: 0.2, metalness: 0.1
            }),
            new THREE.MeshStandardMaterial({ 
                map: createFaceTexture('VI', 'Para Ti', 'Te aprecio muchísimo mi PituFINA. Me alegra haber tenido esa conversación contigo.', true),
                roughness: 0.2, metalness: 0.1
            }),
            new THREE.MeshStandardMaterial({ 
                map: createFaceTexture('I', 'Sinceridad', 'Ayer me quedé pensando bastante en nuestra conversación. Me encantó hablar contigo así, con apertura y sinceridad.'),
                roughness: 0.2, metalness: 0.1
            }),
            new THREE.MeshStandardMaterial({ 
                map: createFaceTexture('II', 'Crecimiento', 'Me dio gusto escucharte, entenderte y darme cuenta de cuánto creces como persona.'),
                roughness: 0.2, metalness: 0.1
            })
        ];

        const cubeSize = 2.4;
        const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        const cube = new THREE.Mesh(geometry, materials);
        scene.add(cube);

        const glowGeo = new THREE.BoxGeometry(cubeSize + 0.05, cubeSize + 0.05, cubeSize + 0.05);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xf472b6,
            wireframe: true,
            transparent: true,
            opacity: 0.2
        });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        cube.add(glowMesh);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xfbbf24, 2, 20);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xf472b6, 2, 20);
        pointLight2.position.set(-5, -5, -5);
        scene.add(pointLight2);

        const particleCount = 150;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i + 1] = (Math.random() - 0.5) * 20;
            positions[i + 2] = (Math.random() - 0.5) * 20;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xfbcfe8,
            size: 0.1,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        let isTransitioning = false;
        let transitionStartQ = new THREE.Quaternion();
        let transitionTargetQ = new THREE.Quaternion();
        let transitionDuration = 1000;
        let transitionStartTime = 0;

        function animateRotationTo(targetQuaternion, duration = 1000) {
            transitionStartQ.copy(cube.quaternion);
            transitionTargetQ.copy(targetQuaternion);
            transitionDuration = duration;
            transitionStartTime = performance.now();
            isTransitioning = true;
        }

        function updateRotationAnimation(now) {
            if (!isTransitioning) return;

            const elapsed = now - transitionStartTime;
            let p = Math.min(elapsed / transitionDuration, 1);
            const easeP = 1 - Math.pow(1 - p, 3);
            
            THREE.Quaternion.slerp(transitionStartQ, transitionTargetQ, cube.quaternion, easeP);

            if (p >= 1) {
                isTransitioning = false;
            }
        }

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let autoRotate = true;
        let idleTimer = null;

        function resetIdleTimer() {
            autoRotate = false;
            isTransitioning = false;
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                autoRotate = true;
            }, 4000);
        }

        function onPointerDown(e) {
            isDragging = true;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x, y };
            resetIdleTimer();

            document.getElementById('instruction-badge').style.opacity = '0';
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = x - previousMousePosition.x;
            const deltaY = y - previousMousePosition.y;

            const deltaRotationQuaternion = new THREE.Quaternion()
                .setFromEuler(new THREE.Euler(
                    deltaY * (Math.PI / 180) * 0.4,
                    deltaX * (Math.PI / 180) * 0.4,
                    0,
                    'XYZ'
                ));

            cube.quaternion.multiplyQuaternions(deltaRotationQuaternion, cube.quaternion);
            previousMousePosition = { x, y };
            resetIdleTimer();
        }

        function onPointerUp() {
            isDragging = false;
        }

        container.addEventListener('mousedown', onPointerDown);
        container.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        container.addEventListener('touchstart', onPointerDown, { passive: true });
        container.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        const faceRotations = {
            front: { x: 0, y: 0, z: 0 },
            back: { x: 0, y: Math.PI, z: 0 },
            left: { x: 0, y: Math.PI / 2, z: 0 },
            right: { x: 0, y: -Math.PI / 2, z: 0 },
            top: { x: -Math.PI / 2, y: 0, z: 0 },
            bottom: { x: Math.PI / 2, y: 0, z: 0 }
        };

        window.rotateToFace = function(faceKey) {
            resetIdleTimer();
            document.getElementById('instruction-badge').style.opacity = '0';

            const targetEuler = faceRotations[faceKey];
            const targetQuaternion = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(targetEuler.x, targetEuler.y, targetEuler.z, 'XYZ')
            );

            animateRotationTo(targetQuaternion, 1200);
        };

        document.getElementById('reset-cam-btn').addEventListener('click', () => {
            resetIdleTimer();
            const targetQuaternion = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(0.3, -0.5, 0, 'XYZ')
            );
            animateRotationTo(targetQuaternion, 1000);
        });

        cube.rotation.set(0.3, -0.5, 0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(now) {
            requestAnimationFrame(animate);

            updateRotationAnimation(now);

            if (autoRotate && !isDragging && !isTransitioning) {
                cube.rotation.y += 0.003;
                cube.rotation.x += 0.001;
            }

            particles.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            animate(performance.now());
        };
    </script>
</body>
</html>
